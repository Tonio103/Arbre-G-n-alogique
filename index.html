<!doctype html>
<!--
  Le thème par défaut est posé ici, pas au premier rendu de React.

  Toute la palette de l'arbre est lue dans les variables CSS de <html> : si
  l'attribut n'existe pas encore au moment où le canevas se peint, le décor
  emprunte les couleurs du thème sombre pendant que l'interface, elle, est déjà
  claire. Le choix mémorisé de l'utilisateur écrase cette valeur avant la
  première image.
-->
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237fb0ff'/%3E%3Cstop offset='1' stop-color='%23ff9fc4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='16' cy='9' r='3'/%3E%3Ccircle cx='9.5' cy='23' r='3'/%3E%3Ccircle cx='22.5' cy='23' r='3'/%3E%3C/g%3E%3Cpath d='M16 12v4M9.5 20v-4h13v4' stroke='%23fff' stroke-width='1.8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Arbre généalogique interactif : parcourez plusieurs générations, recherchez une personne, explorez les branches familiales."
    />
    <title>Arbre généalogique</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Cette application nécessite JavaScript pour afficher l'arbre généalogique.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
